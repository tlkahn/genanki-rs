[package]
name = "genanki"
version = "0.1.0"
edition = "2024"
description = "Generate Anki .apkg decks programmatically"
license = "MIT"
repository = "https://github.com/tlkahn/genanki-rs"
homepage = "https://github.com/tlkahn/genanki-rs"
documentation = "https://docs.rs/genanki"
readme = "README.md"
keywords = ["anki", "flashcards", "apkg", "deck"]
categories = ["encoding", "multimedia"]
exclude = ["doc/", ".github/"]

[dependencies]
# Phase 1: GUID hashing + error derive. Further deps land in later phases (epic #1).
sha2 = "0.10"      # SHA-256 for note/card GUIDs (Python genanki parity)
thiserror = "2"    # #[derive(Error)] for the crate error type
# Phase 2: model JSON for col.models entries (nested null/bool/mixed-array objects).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Phase 3: cloze parsing + invalid-HTML scan (note validation).
regex = "1"
# Phase 3: non-fatal invalid-HTML warnings on note construct (facade is zero-cost without a logger).
log = "0.4"
# Phase 4 (issue #6): .apkg production - temp sqlite, zip layout, media.
rusqlite = { version = "0.37", features = ["bundled"] }  # bundled: no system libsqlite
zip = "2"       # write + read in structural tests
# Runtime dep (matches Python tempfile.mkstemp): temp collection.anki2 during write.
tempfile = "3"

[dev-dependencies]
# None required: rusqlite + zip already available to tests via the crate under test.
